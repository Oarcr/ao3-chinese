name: 🐛 Bug 反馈（简体中文）
description: 简体中文表单：报告脚本运行异常、翻译故障或兼容性问题。
title: '[Bug]: '
body:
- type: markdown
  attributes:
    value: '**表单语言：简体中文（默认） · [切换到 English](https://github.com/V-Lipset/ao3-chinese/issues/new?template=02-bug-report-en.yml)**


      感谢帮助改进 AO3 Translator！请尽量填写完整信息，方便维护者复现和定位问题。


      提交前请先查看[常见问题](https://v-lipset.github.io/docs/support/faq/)并[搜索已有 Issues](https://github.com/V-Lipset/ao3-chinese/issues?q=is%3Aissue)。如果只是使用方法或配置求助，请优先前往
      [Discussions 讨论区](https://github.com/V-Lipset/ao3-chinese/discussions)。'
- type: checkboxes
  id: issue-search
  attributes:
    label: 提交前确认
    description: 请先搜索已有问题，避免重复提交。
    options:
    - label: 我已搜索现有 Issues，未找到相同问题。
      required: true
  validations:
    required: true
- type: dropdown
  id: feature-area
  attributes:
    label: 问题所属功能
    description: 请选择最接近的一项；如果不确定，请选择“其他或不确定”。
    options:
    - 页面界面汉化
    - 作品正文、简介或备注翻译
    - AI 或自定义翻译服务
    - 语言检测
    - 术语表或翻译规则
    - 作品屏蔽
    - 阅读排版与格式
    - EPUB 等电子书导出
    - 设置、配置导入导出
    - 缓存管理
    - WebDAV 或其他数据同步
    - 悬浮按钮或设置面板
    - 安装、更新或脚本权限
    - 网站兼容性
    - 其他或不确定
  validations:
    required: true
- type: textarea
  id: actual-behavior
  attributes:
    label: 实际发生了什么？
    description: 请描述具体现象、错误提示，以及问题影响了什么。避免只写“不能用”或“翻译失败”。
    placeholder: 例如：打开作品章节后，界面已经汉化，但点击翻译按钮一直显示加载中，几分钟后仍没有译文。
  validations:
    required: true
- type: textarea
  id: expected-behavior
  attributes:
    label: 你原本期望发生什么？
    description: 请说明正常情况下应该出现什么结果。
    placeholder: 例如：点击翻译按钮后，应显示对应段落的译文。
  validations:
    required: true
- type: textarea
  id: reproduction-steps
  attributes:
    label: 复现步骤
    description: 请按顺序写出从打开页面到问题出现的操作。如果问题只在特定页面出现，请说明页面类型；不方便公开具体作品链接时，无需提供完整 URL。
    placeholder: '1. 打开 AO3 的某个作品章节。

      2. 打开 AO3 Translator 设置面板。

      3. 启用或选择……

      4. 点击……

      5. 观察到……'
  validations:
    required: true
- type: dropdown
  id: occurrence
  attributes:
    label: 问题出现频率
    description: 请选择最符合实际情况的一项。
    options:
    - 每次都能复现
    - 偶尔出现
    - 仅在某个作品、章节或页面出现
    - 仅在某个站点出现
    - 只出现过一次
    - 不确定
  validations:
    required: true
- type: dropdown
  id: website
  attributes:
    label: 出问题的网站
    description: 如果是镜像站，请在下一项填写域名；涉及账号或私人信息的 URL 不要贴出。
    options:
    - AO3 官方站：archiveofourown.org
    - archiveofourown.gay
    - 其他 AO3 镜像站
    - 与特定网站无关
    - 不确定
  validations:
    required: true
- type: input
  id: website-domain
  attributes:
    label: 网站域名（可选）
    description: 仅在其他镜像站或特定网站出现问题时填写域名即可，无需提供完整作品链接。
    placeholder: 例如：example-mirror.com
  validations:
    required: false
- type: input
  id: script-version
  attributes:
    label: AO3 Translator 脚本版本
    description: 可在脚本管理器的脚本详情中查看；如果不知道，请填写“不确定”。
    placeholder: 例如：1.10.2-2026-09-22
  validations:
    required: true
- type: dropdown
  id: install-variant
  attributes:
    label: 安装的脚本版本
    description: 如果不清楚使用的是哪一种，请选择“不确定”。
    options:
    - 主用远程版
    - 主用本地版
    - 备用远程版
    - 备用本地版
    - 其他安装方式
    - 不确定
  validations:
    required: true
- type: dropdown
  id: operating-system
  attributes:
    label: 操作系统
    description: 请选择实际运行浏览器的设备系统，而不只是设备品牌。此项必填。
    options:
    - Windows
    - macOS
    - Linux
    - Android
    - iOS / iPadOS
    - ChromeOS
    - 其他
    - 不确定
  validations:
    required: true
- type: input
  id: operating-system-version
  attributes:
    label: 操作系统版本（可选）
    description: 如果知道，请尽量填写系统版本或版本号。
    placeholder: 例如：Windows 11 24H2、macOS 15、Android 16、iOS 18
  validations:
    required: false
- type: dropdown
  id: browser
  attributes:
    label: 浏览器
    description: 请选择打开 AO3 的浏览器。
    options:
    - Google Chrome
    - Microsoft Edge
    - Mozilla Firefox
    - Safari
    - Via
    - Focus
    - Kiwi Browser
    - Yandex Browser
    - 其他
    - 不确定
  validations:
    required: true
- type: input
  id: browser-version
  attributes:
    label: 浏览器版本（可选）
    description: 可在浏览器的“关于”页面查看；如果不知道，可留空。
    placeholder: 例如：Chrome 131.0.6778.86
  validations:
    required: false
- type: dropdown
  id: userscript-manager
  attributes:
    label: 用户脚本管理器
    description: 请选择安装或运行 AO3 Translator 的脚本管理器。
    options:
    - Tampermonkey（篡改猴）
    - Violentmonkey
    - ScriptCat（脚本猫）
    - Greasemonkey
    - Userscripts（iOS）
    - Stay（iOS）
    - Via / Focus 内置脚本管理器
    - 其他
    - 不确定
  validations:
    required: true
- type: input
  id: userscript-manager-version
  attributes:
    label: 脚本管理器版本（可选）
    description: 可在脚本管理器的扩展详情或“关于”页面查看；不知道可以留空。
    placeholder: 例如：Tampermonkey 5.x
  validations:
    required: false
- type: dropdown
  id: translation-service
  attributes:
    label: 涉及的翻译服务（可选）
    description: 仅当问题与作品翻译、语言检测或翻译接口有关时填写。
    options:
    - Google 翻译
    - Microsoft / Bing 翻译
    - 腾讯 TranSmart
    - Anthropic / Claude
    - DeepSeek
    - Google AI / Gemini
    - Groq
    - OpenAI
    - SiliconFlow
    - Cerebras
    - ModelScope
    - Together AI
    - 智谱 AI
    - 自定义 API / 其他服务
    - 与翻译服务无关
    - 不确定
  validations:
    required: false
- type: input
  id: model-name
  attributes:
    label: 模型名称（可选）
    description: 如果是 AI 翻译问题，请填写实际选择的模型 ID；不要填写 API Key。
    placeholder: 例如：deepseek-chat
  validations:
    required: false
- type: textarea
  id: logs
  attributes:
    label: 相关日志或错误信息（可选）
    description: 可在脚本“更多功能 → 调试模式与日志”中查看或导出运行日志，也可粘贴浏览器控制台里的相关错误。提交前请删除 API Key、访问令牌、密码、Cookie 及其他敏感信息。没有日志可留空。
    placeholder: 将相关错误信息或日志粘贴在这里；请勿粘贴密钥或密码。
  validations:
    required: false
- type: upload
  id: attachments
  attributes:
    label: 截图、录屏或日志文件（可选）
    description: 附件有助于复现问题。上传前请遮盖账号信息、API Key、令牌、密码、私人书签及不希望公开的内容。
  validations:
    required: false
- type: textarea
  id: additional-context
  attributes:
    label: 其他补充信息（可选）
    description: 例如问题从哪个版本开始出现、是否在更新后发生、是否尝试过禁用其他脚本或扩展等。
    placeholder: 任何有助于定位问题的补充信息。
  validations:
    required: false
- type: checkboxes
  id: sensitive-information
  attributes:
    label: 隐私与敏感信息确认
    description: 提交前请检查正文和附件。
    options:
    - label: 我已检查正文和附件，没有包含 API Key、密码、访问令牌、Cookie 或其他不应公开的信息。
      required: true
  validations:
    required: true
