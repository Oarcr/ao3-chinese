name: "Feature request / 功能建议"
description: "提出新功能或改进建议，说明当前需求和期望效果。"
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议！请尽量描述你实际遇到的使用场景，以及新功能能解决什么问题。

        提交前请先[搜索现有 Issues](https://github.com/V-Lipset/ao3-chinese/issues?q=is%3Aissue)，并查看[项目文档与常见问题](https://v-lipset.github.io/docs/support/faq/)。如果只是询问使用方法或配置方式，请优先前往 [Discussions 讨论区](https://github.com/V-Lipset/ao3-chinese/discussions)。

        You may submit this request in Chinese or English.

  - type: checkboxes
    id: issue-search
    attributes:
      label: 提交前确认 / Before submitting
      options:
        - label: 我已搜索现有 Issues，未找到相同或相近的建议。 / I searched existing issues for similar requests.
          required: true
    validations:
      required: true

  - type: dropdown
    id: feature-area
    attributes:
      label: 建议所属功能 / Feature area
      options:
        - 页面界面汉化 / UI translation
        - 作品正文、简介或备注翻译 / Work text translation
        - AI 或自定义翻译服务 / AI or custom translation service
        - 语言检测 / Language detection
        - 术语表或翻译规则 / Glossary or translation rules
        - 作品屏蔽 / Work filtering or blocking
        - 阅读排版与格式 / Reading layout or formatting
        - EPUB 等电子书导出 / EPUB or ebook export
        - 设置、配置导入导出 / Settings or configuration import/export
        - 缓存管理 / Cache management
        - WebDAV 或其他数据同步 / WebDAV or data sync
        - 悬浮按钮或设置面板 / Floating button or settings panel
        - 安装、更新或兼容性 / Installation, updates, or compatibility
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: current-problem
    attributes:
      label: 你希望解决什么问题？/ What problem would this solve?
      description: 描述当前遇到的困难、现有功能的不足，以及为什么需要改进。尽量描述具体场景，而不只是提出一个按钮或功能名称。
      placeholder: |
        例如：当我……时，目前需要……，这会导致……。
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: 你期望怎样改进？/ What would you like to happen?
      description: 描述你希望新增或修改的行为。不需要设计完整的技术实现方案。
      placeholder: |
        例如：希望增加……，这样我就可以……。
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: 使用场景或示例（可选）/ Use case or example (optional)
      description: 如果方便，请提供示例文本、操作流程、截图或具体场景，帮助维护者理解需求。
      placeholder: 描述你会在什么情况下使用这项功能。
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案（可选）/ Alternatives considered (optional)
      description: 目前是否有其他设置、工作流程或工具可以解决？它们有什么不足？没有可留空。
      placeholder: 目前的解决方法，以及它为什么不能完全满足需求。
    validations:
      required: false

  - type: upload
    id: attachments
    attributes:
      label: 截图或参考资料（可选）/ Screenshots or references (optional)
      description: 可上传示意图或相关文件。请勿上传 API Key、密码、访问令牌或私人信息。
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 其他补充信息（可选）/ Additional context (optional)
      placeholder: 其他有助于理解这项建议的信息。
    validations:
      required: false
