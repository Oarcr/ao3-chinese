name: 💡 Feature Request (English)
description: 'English form: suggest a feature or improvement and explain the use case.'
title: '[Feature]: '
body:
- type: markdown
  attributes:
    value: '**Form language: [简体中文](https://github.com/V-Lipset/ao3-chinese/issues/new?template=03-feature-request-zh.yml)
      · English (current)**


      Thanks for suggesting an improvement! Please describe the situation you encountered and how the proposed feature
      would help.


      Before submitting, [search existing issues](https://github.com/V-Lipset/ao3-chinese/issues?q=is%3Aissue) and
      check the [documentation and FAQ](https://v-lipset.github.io/docs/support/faq/). For usage or configuration
      questions, please use [GitHub Discussions](https://github.com/V-Lipset/ao3-chinese/discussions).'
- type: checkboxes
  id: issue-search
  attributes:
    label: Before submitting
    description: Please search for existing requests to avoid duplicates.
    options:
    - label: I searched existing issues and could not find the same or a similar request.
      required: true
  validations:
    required: true
- type: dropdown
  id: feature-area
  attributes:
    label: Feature area
    description: Choose the area that best matches your suggestion.
    options:
    - UI translation
    - Work text, summary, or notes translation
    - AI or custom translation service
    - Language detection
    - Glossary or translation rules
    - Work filtering or blocking
    - Reading layout and formatting
    - EPUB or other ebook export
    - Settings or configuration import/export
    - Cache management
    - WebDAV or other data sync
    - Floating button or settings panel
    - Installation, updates, or script permissions
    - Website compatibility
    - Other / Not sure
  validations:
    required: true
- type: textarea
  id: current-problem
  attributes:
    label: What problem would this solve?
    description: Describe the difficulty you face, what is missing from the current functionality, and why an improvement
      is needed. Focus on the use case rather than only naming a button or feature.
    placeholder: 'Example: When I …, I currently have to …, which leads to ….'
  validations:
    required: true
- type: textarea
  id: proposed-solution
  attributes:
    label: What would you like to happen?
    description: Describe the behavior you would like to add or change. You do not need to propose a complete technical
      implementation.
    placeholder: 'Example: I would like … so that I can ….'
  validations:
    required: true
- type: textarea
  id: use-case
  attributes:
    label: Use case or example (optional)
    description: If possible, provide sample text, a workflow, a screenshot, or a concrete scenario to help the
      maintainer understand the request.
    placeholder: Describe when you would use this feature.
  validations:
    required: false
- type: textarea
  id: alternatives
  attributes:
    label: Alternatives considered (optional)
    description: Are there settings, workflows, or tools that already solve this? What are their limitations? Leave
      blank if not applicable.
    placeholder: Describe your current workaround and why it is not sufficient.
  validations:
    required: false
- type: upload
  id: attachments
  attributes:
    label: Screenshots or references (optional)
    description: Upload mockups or relevant files if helpful. Do not upload API keys, passwords, access tokens,
      or private information.
  validations:
    required: false
- type: textarea
  id: additional-context
  attributes:
    label: Additional context (optional)
    description: Any other information that may help explain the request.
  validations:
    required: false
